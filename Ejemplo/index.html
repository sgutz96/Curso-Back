<!DOCTYPE html>
<html long = "pt-br">
	<head>
		<meta charset = "UFT-8">
		<meta name = "viewport" content = "width-device-width, instal-scale-1.0">
		<title>Loging-helper</title>
		<link rel="stylesheet" href="./css/styles.css">
		<script src="./js/index.js" defer></script>
		
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
		
		<script src="https://kit.fontawesome.com/af912fca41.js" crossorigin="anonymous"></script>
		
	</head>
	<body>
		<header>
			<h1>Loging-helper</h1>
		</header>
		<main>
			<form>
				<section class="inputs-container">
					<input type="email" placeholder="Example@email.com">
					<div class="password-container">
						<input type="password" id="field-password" class="field-password" placeholder="********">
						<i class="fas fa-eye" id="eye" onclick="showPassword()"></i>
						<i class="fas fa-eye-slash" id="eye-slash" onClick="showPassword()"></i>
					</div>
				</section>	
				<section class="password-infos">
					<div>
						<input type ="checkbox">
						<span>Recordar Contraseña?</span>
					</div>
					<a href ="#">Olvidaste tu contraseña?</a>
				</section>
				<button id="btn-login">Login</button>
				<section class="link-container">
					<span>o entrar con</span>
					<aside>
						<a href ="#"><i class="fab fa-google-plus-square google"></i></a>
						<a href ="#"><i class="fab fa-linkedin linkedin"></i></a>
						<a href ="#"><i class="fab fa-facebook-square facebook"></i></a>		
					</aside>						
				</section>
				<footer>
					<hr>
					<span>Aun no posees una cuenta <a href="#">Registrarce</a></span>
				</footer>
			</form>
		</main>
	</body>
</html>
